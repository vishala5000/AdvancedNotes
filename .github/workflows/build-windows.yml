name: Build Advanced Notes for Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Windows 7 10 11 Application

    runs-on: windows-2022

    steps:

      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # PYTHON
      # -------------------------------------------------------

      - name: Setup Python 3.8.10 x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x86

      # -------------------------------------------------------
      # VERIFY PYTHON
      # -------------------------------------------------------

      - name: Verify Python
        shell: cmd
        run: |
          python --version
          python -c "import platform; print(platform.architecture())"

      # -------------------------------------------------------
      # INSTALL PYTHON DEPENDENCIES
      # -------------------------------------------------------

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install -r requirements.txt

      # -------------------------------------------------------
      # VERIFY SOURCE CODE
      # -------------------------------------------------------

      - name: Verify Python files
        shell: cmd
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile database.py
          python -m py_compile security.py
          python -m py_compile ui.py

      # -------------------------------------------------------
      # BUILD WINDOWS APPLICATION
      # -------------------------------------------------------

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --onedir ^
            --name AdvancedNotes ^
            app.py

      # -------------------------------------------------------
      # VERIFY EXE
      # -------------------------------------------------------

      - name: Verify executable
        shell: cmd
        run: |
          if not exist "dist\AdvancedNotes\AdvancedNotes.exe" (
            echo ERROR: AdvancedNotes.exe was not created.
            exit /b 1
          )

          echo.
          echo ==========================================
          echo WINDOWS APPLICATION BUILD SUCCESSFUL
          echo ==========================================
          echo.

      # -------------------------------------------------------
      # FIND INNO SETUP
      # -------------------------------------------------------

      - name: Locate Inno Setup
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "LOCATING INNO SETUP"
          Write-Host "=========================================="

          $paths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $null

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  $iscc = $path
                  break
              }
          }

          if (-not $iscc) {
              $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue

              if ($command) {
                  $iscc = $command.Source
              }
          }

          if (-not $iscc) {
              Write-Host "Inno Setup was not found."
              exit 1
          }

          Write-Host "Inno Setup compiler found:"
          Write-Host $iscc

          "ISCC_PATH=$iscc" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # -------------------------------------------------------
      # BUILD INSTALLER
      # -------------------------------------------------------

      - name: Build Windows installer
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING WINDOWS INSTALLER"
          Write-Host "=========================================="

          if (-not $env:ISCC_PATH) {
              Write-Host "ERROR: ISCC_PATH is not set."
              exit 1
          }

          if (-not (Test-Path $env:ISCC_PATH)) {
              Write-Host "ERROR: Inno Setup compiler does not exist:"
              Write-Host $env:ISCC_PATH
              exit 1
          }

          Write-Host "Using Inno Setup:"
          Write-Host $env:ISCC_PATH

          & $env:ISCC_PATH "installer.iss"

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Inno Setup failed."
              exit $LASTEXITCODE
          }

          Write-Host "=========================================="
          Write-Host "INSTALLER BUILD SUCCESSFUL"
          Write-Host "=========================================="

      # -------------------------------------------------------
      # VERIFY INSTALLER
      # -------------------------------------------------------

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer\AdvancedNotes-Setup.exe"

          if (-not (Test-Path $installer)) {
              Write-Host "ERROR: Installer was not created."
              exit 1
          }

          Write-Host "Installer successfully created:"
          Write-Host $installer

          $size = (Get-Item $installer).Length

          Write-Host "Installer size:"
          Write-Host "$size bytes"

      # -------------------------------------------------------
      # CREATE PORTABLE ZIP
      # -------------------------------------------------------

      - name: Create portable ZIP
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE ZIP"
          Write-Host "=========================================="

          if (Test-Path "AdvancedNotes-Portable.zip") {
              Remove-Item "AdvancedNotes-Portable.zip" -Force
          }

          Compress-Archive `
            -Path "dist\AdvancedNotes\*" `
            -DestinationPath "AdvancedNotes-Portable.zip" `
            -Force

          if (-not (Test-Path "AdvancedNotes-Portable.zip")) {
              Write-Host "ERROR: Portable ZIP was not created."
              exit 1
          }

          Write-Host "Portable ZIP created successfully."

      # -------------------------------------------------------
      # UPLOAD PORTABLE VERSION
      # -------------------------------------------------------

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedNotes-Portable
          path: AdvancedNotes-Portable.zip
          if-no-files-found: error

      # -------------------------------------------------------
      # UPLOAD INSTALLER
      # -------------------------------------------------------

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedNotes-Windows-Installer
          path: installer\AdvancedNotes-Setup.exe
          if-no-files-found: error
